[project]
name = "pfs_etc_web"
description = "PFS Exposure Time Calculator Web Application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Masato Onodera", email = "monodera@naoj.org" }]
keywords = [
  "astronomy",
  "etc",
  "exposure-time-calculator",
  "pfs",
  "spectroscopy",
]
dependencies = [
  "astropy>=6.1.0",
  "fontawesome-markdown @ https://github.com/bmcorser/fontawesome-markdown/archive/master.zip",
  "loguru>=0.7.2",
  "mkdocs>=1.4.3",
  "mkdocs-macros-plugin>=0.7.0",
  "mkdocs-material[imaging]>=9.5.3",
  "mkdocs-video>=1.5.0",
  "myst-parser>=1.0.0",
  "numpy>=2.0.0",
  "pandas>=2.2.2",
  "panel>=1.5.0",
  "pfsspecsim @ git+https://github.com/Subaru-PFS/spt_ExposureTimeCalculator.git",
  "python-dotenv>=1.2.2",
  "synphot>=1.2.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Subaru-PFS/spt_etc_webapp"
Repository = "https://github.com/Subaru-PFS/spt_etc_webapp"

[project.scripts]
# NOTE: This CLI entry point is available but not actively used.
# For development and production, use the shell scripts in scripts/ directory instead:
# - scripts/serve-app.sh (recommended)
# The CLI provides basic functionality but lacks some features (static dirs, prefix, etc.)
run_pfs_etc_web = "pfs_etc_web.cli.run_panel_server:main"

[project.optional-dependencies]
dev = [
  "black>=22.12.0",
  "ipython>=8.9.0",
  "matplotlib>=3.8.4",
  "pytest>=9.1.1",
  "ruff>=0.0.239",
  "seaborn>=0.13.2",
  "specutils>=1.10.0",
  "ty>=0.0.5",
  "watchfiles>=0.21.0",
]

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py312"]

